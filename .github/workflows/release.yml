name: Release
# 标签触发检查、打包并上传 Release 附件；手动运行仅验证，不发布。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run checks and pack without publishing a Release'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Node-side suites
        run: node test/run.mjs
      - name: Real-browser suite
        run: node test/run-e2e-headless.mjs
      - name: Publishable tarball shape
        run: node tools/pack-check.mjs
      - name: Version and tag agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package.json $version" >&2
            exit 1
          fi
      - name: Pack release assets
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          cd dist
          sha256sum *.tgz > SHA256SUMS.txt
      - name: Keep validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
      - name: Create the GitHub release with assets
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/SHA256SUMS.txt --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false
